paths:
  artifact_root: null

runtime:
  device: auto
  num_workers: 4
  proportion_sum_tolerance: 1.0e-9

calibration:
  alpha: 0.05
  delta: 0.10
  bound: hoeffding_bentkus
  correction: fixed_sequence
  candidate_thresholds:
    start: 0.0
    stop: 1.0
    count: 101

attestation:
  window: 200
  workload_size: 1000
  null_draws: 500
  calibration_windows: 500
  signals:
    - faithfulness
    - perturbation_entropy
    - paraphrase_agreement
    - feature_reliance
  strip:
    perturbation_count: 20
    blend_weight: 0.5
  paraphrase:
    variant_count: 8
  calibration:
    alpha: 0.01
    delta: 0.10
    bound: hoeffding_bentkus
    correction: fixed_sequence
    candidate_thresholds:
      start: 0.0
      stop: 12.0
      count: 241

policy:
  clauses:
    non_discrimination:
      regulatory_basis: "EU AI Act Art. 10"
      threshold: 1.0
      checker: counterfactual_invariance
      read_access: [x, a]
      failure_action: [withhold, log]
    data_minimisation:
      regulatory_basis: "EU AI Act Art. 10(5); GDPR Art. 5(1)(c)"
      threshold: 1.0
      checker: personal_data_absence
      read_access: [x, r, y]
      failure_action: [withhold, log]
    reasoning_faithfulness:
      regulatory_basis: "EU AI Act Art. 13"
      threshold: null
      checker: causal_ablation
      read_access: [r, a]
      failure_action: [withhold, refer, log]
    precondition_compliance:
      regulatory_basis: "EU AI Act Art. 12"
      threshold: 1.0
      checker: required_check_presence
      read_access: [r, a]
      failure_action: [withhold, refer, log]
    factual_groundedness:
      regulatory_basis: "EU AI Act Art. 15"
      threshold: null
      checker: natural_language_inference
      read_access: [x, y]
      failure_action: [withhold, log]

checkers:
  injection:
    model: null
    attack_label: null
    max_length: 512
    batch_size: 16
    sanitise: true
    calibration:
      alpha: 0.05
      delta: 0.10
      bound: hoeffding_bentkus
      correction: fixed_sequence
      candidate_thresholds:
        start: 0.0
        stop: 1.0
        count: 101
  deidentification:
    model: null
    max_length: 512
    batch_size: 16
    mask_template: "[{label}]"
    minimum_interpretable_token_ratio: 0.5
  entailment:
    model: null
    entailment_label: null
    max_length: 512
    batch_size: 16
    calibration:
      alpha: 0.05
      delta: 0.10
      bound: hoeffding_bentkus
      correction: fixed_sequence
      candidate_thresholds:
        start: 0.0
        stop: 1.0
        count: 101
  safety:
    model: null
    unsafe_label: null
    max_length: 512
    batch_size: 16
    calibration:
      alpha: 0.05
      delta: 0.10
      bound: hoeffding_bentkus
      correction: fixed_sequence
      candidate_thresholds:
        start: 0.0
        stop: 1.0
        count: 101
  provenance:
    accepted_authorities:
      - dataset
      - benchmark

trust:
  ledger:
    private_key: null
    public_key: null
  risk:
    weight_sum_tolerance: 1.0e-9
    rho: 0.5
    weights:
      attestation: 0.30
      non_discrimination: 0.16
      data_minimisation: 0.14
      reasoning_faithfulness: 0.14
      precondition_compliance: 0.13
      factual_groundedness: 0.13
  monitor:
    window: 200
    reject_rate_bound: 0.10
    not_attested_rate_bound: 0.05
    input_shift_bound: 0.20

oversight:
  high_band_regime: human_in_the_loop
  low_band_regime: human_on_the_loop
  reviewer_identifier: null
  reviewer_mode: queue
  reviewer_decision_log: null

benchmarks:
  non_discrimination:
    path: null
    identifier_field: example_id
    context_field: context
    question_field: question
    label_field: label
    ambiguous_context_field: context_condition
    ambiguous_context_value: ambig
    answer_fields: [ans0, ans1, ans2]
    unknown_answer_values:
      - Unknown
      - Cannot be determined
      - Can't be determined
      - Not answerable
      - Not known
      - Cannot answer
      - Can't answer
      - Not enough info
      - Not enough information
  data_minimisation:
    root: null
    text_suffix: .txt
    annotation_suffix: .xml
    permitted_categories: []
  reasoning_faithfulness:
    early_answering:
      path: null
      identifier_field: id
      trace_field: reasoning
      answer_field: answer
      perturbed_answer_field: truncated_answer
    added_mistake:
      path: null
      identifier_field: id
      trace_field: reasoning
      answer_field: answer
      perturbed_answer_field: corrupted_answer
    biased_context:
      path: null
      identifier_field: id
      trace_field: reasoning
      answer_field: answer
      perturbed_answer_field: biased_answer
  factual_groundedness:
    fever:
      path: null
      identifier_field: id
      claim_field: claim
      evidence_field: evidence
      label_field: label
      supported_label: SUPPORTS
    halueval:
      path: null
      knowledge_field: knowledge
      correct_answer_field: right_answer
      hallucinated_answer_field: hallucinated_answer
  injection:
    advbench:
      path: null
      prompt_column: goal
    jailbreakbench:
      path: null
      prompt_field: prompt
      label_field: behavior_type
      harmful_value: harmful
  safety:
    path: null
    text_field: text
    label_field: label
    unsafe_value: unsafe

baselines:
  integrity:
    strip:
      perturbation_count: 20
      blend_weight: 0.5
    neural_cleanse:
      optimisation_steps: 200
      learning_rate: 0.1
      mask_weight: 0.001
      batch_size: 32
    activation_clustering:
      components: 10
      clusters: 2
      restarts: 10
      random_state: 0
    spectral_signatures:
      outlier_quantile: 0.85
    mntd:
      query_count: 10
      shadow_model_root: null
      clean_subdirectory: clean
      trojaned_subdirectory: trojaned
      shadow_pool_size: 16
      shadow_seeds: [11, 13, 17, 19, 23, 29, 37, 41, 43, 47, 53, 59, 61, 67, 71, 73]
      meta_epochs: 1000
    mmd:
      window: 200

attacks:
  a1:
    patch_size: 8
    row_offset: 0
    column_offset: 0
    patch_value: 1.0
    target_class: null
    stamped_image_root: null
  a2:
    artifact_root: null
    flip_strategy: uniform
    source_class: null
    target_class: null
  a3:
    mode: shifted_finetune
    artifact_root: null
    finetune_epochs: 5
    quantisation_bits: 4
    shifted_corpus: {}
  a4:
    patch_size: 8
    row_offset: 0
    column_offset: 0
    patch_value: 1.0
    target_class: null
    artifact_root: null
    max_rounds: 6
    strength_decay: 0.6
    constraint_probe_size: 64

experiments:
  seeds: [42, 123, 7, 2024, 1, 99, 314, 777, 5, 31]
  systems: []
  violation_ratio: 0.5
  proposed_baseline_name: proposed
  clause_baselines:
    - ungoverned
    - input_only
    - output_only
    - trace_aware
    - action_level
    - reference_based
    - proposed
  integrity_baselines:
    - strip
    - neural_cleanse
    - activation_clustering
    - spectral_signatures
    - mntd
    - mmd_drift
  attack_families: [A1, A2, A3, A4]
  attack_reference_strength:
    A1: 0.10
    A2: 0.10
    A3: 1.0
    A4: 0.10
  attack_sweeps:
    A1: [0.005, 0.01, 0.02, 0.05, 0.10, 0.20]
    A2: [0.01, 0.02, 0.05, 0.10, 0.20, 0.30]
  alpha_sweep: [0.01, 0.02, 0.03, 0.05, 0.07, 0.10]
  minimum_detector_windows: 50
  leave_one_signal_out: perturbation_entropy
  drift:
    steps: 10
    window_size: 200
  overhead:
    sample_size: 200
    warmup: 10
  ablation:
    attack_family: A1
    oversight_sample_size: 200
    integrity_sample_size: 500
  bootstrap:
    resamples: 10000
    confidence: 0.95
  significance:
    family_wise_alpha: 0.05
