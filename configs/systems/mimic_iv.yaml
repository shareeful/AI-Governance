systems:
  mimic_iv:
    kind: tabular_decision
    modality: tabular
    regulatory_basis: "EU AI Act Annex I (clinical decision)"
    reason_count: 5
    protected_attributes: [gender, ethnicity]
    protected_attribute_domains:
      gender: []
      ethnicity: []
    minimum_necessary_personal_data: []
    dataset:
      path: null
      separator: ","
      target_column: null
      identifier_column: stay_id
      group_column: subject_id
      positive_class: null
      protected_columns: [gender, ethnicity]
      numeric_columns: []
      categorical_columns: []
      feature_groups: {}
      partition:
        train: 0.7
        calibration: 0.15
        test: 0.15
    model:
      n_estimators: 500
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      reg_lambda: 1.0
      early_stopping_rounds: 25
      num_classes: 2
      class_names: []
      background_size: 200
    paraphrase:
      numeric_relative_jitter: 0.01
    perturbation:
      mix_weight: 0.5
    preconditions:
      recorded_check_policy: as_evaluated
      evidence_fields: []
    templates:
      reason: "Feature group {group} contributes attribution mass {mass} to the decision."
      claim: "The {action} decision is supported by feature group {group}."
      evidence: "Feature group {group} carries attribution mass {mass} for this admission."
      check: "Recorded clinical check: {check}."
    action_register:
      issue_clinical_decision:
        high_risk: true
        required_checks: []
