systems:
  compas:
    kind: tabular_decision
    modality: tabular
    regulatory_basis: "EU AI Act Annex III(6)"
    reason_count: 5
    protected_attributes: [race]
    protected_attribute_domains:
      race: []
    minimum_necessary_personal_data: []
    dataset:
      path: null
      separator: ","
      target_column: two_year_recid
      identifier_column: id
      group_column: id
      positive_class: "1"
      protected_columns: [race]
      numeric_columns: []
      categorical_columns: []
      feature_groups: {}
      partition:
        train: 0.7
        calibration: 0.15
        test: 0.15
    model:
      n_estimators: 400
      max_depth: 4
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      reg_lambda: 1.0
      early_stopping_rounds: 25
      num_classes: 2
      class_names: ["0", "1"]
      background_size: 200
    paraphrase:
      numeric_relative_jitter: 0.01
    perturbation:
      mix_weight: 0.5
    preconditions:
      recorded_check_policy: as_evaluated
      evidence_fields: []
    templates:
      reason: "Feature group {group} contributes attribution mass {mass} to the risk score."
      claim: "The {action} risk band is supported by feature group {group}."
      evidence: "Feature group {group} carries attribution mass {mass} for this record."
      check: "Recorded procedural check: {check}."
    action_register:
      issue_risk_score:
        high_risk: true
        required_checks: []
